      /* Runtime resilience mode — automatically enabled on mobile Safari,

        content: '';

      /* Subtle rotating conic glow — used on AI surfaces */

      /* Custom scrollbar utility — opt-in for content surfaces */
      .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }

      /* Safe-area padding for sticky composers (Arquitecto Agente input,

      .safe-bottom { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 0.75rem); }
      @supports not (padding: env(safe-area-inset-bottom)) {
        .safe-bottom { padding-bottom: 0.75rem; }
      }
    </style>

    <!-- Theme bootstrap: auto-detect prefers-color-scheme on first load
         and apply before React mounts to prevent dark/light flicker. -->
    <script>
      (function bootstrapTheme() {
        try {
          var stored = localStorage.getItem('arky_theme'); // 'light' | 'dark' | 'system'
          var isDark;
          if (stored === 'dark') {
            isDark = true;
          } else if (stored === 'light') {
            isDark = false;
          } else {
            // 'system' or unset — follow OS preference
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          if (isDark) document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
        } catch (e) {
          // localStorage unavailable — default to OS preference
          if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          }
        }
      })();
    </script>

  <body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 antialiased overscroll-none selection:bg-primary-200 dark:selection:bg-primary-900">
    <div id="root">
      <div id="arky-bootstrap-shell" style="min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#09090b;color:#fafafa;font-family:Inter,system-ui,sans-serif;padding:24px;text-align:center;">

          <div style="width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,#6366f1,#d946ef);display:inline-flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:16px;">✦</div>

          <p style="margin:0 0 14px;color:#d4d4d8;font-size:14px;line-height:1.6;">Si esta pantalla no cambia, usa las acciones de recuperación. Puedes reintentar carga, limpiar estado local corrupto o abrir una vista segura en modo texto.</p><div style="display:flex;flex-wrap:wrap;justify-content:center;gap:8px;"><button type="button" onclick="window.location.reload()" style="padding:9px 12px;border-radius:10px;border:0;background:#4f46e5;color:white;font-size:12px;font-weight:700;">Reintentar carga</button><button type="button" onclick="try{localStorage.removeItem('arky:last-stable-route');sessionStorage.clear();}catch(e){} window.location.href='/';" style="padding:9px 12px;border-radius:10px;border:1px solid #3f3f46;background:transparent;color:#e4e4e7;font-size:12px;font-weight:600;">Volver estable</button><button type="button" onclick="try{localStorage.clear();sessionStorage.clear();}catch(e){} window.location.reload();" style="padding:9px 12px;border-radius:10px;border:1px solid #3f3f46;background:transparent;color:#e4e4e7;font-size:12px;font-weight:600;">Limpiar estado</button><button type="button" onclick="window.location.href='/?safeMode=text';" style="padding:9px 12px;border-radius:10px;border:1px solid #3f3f46;background:transparent;color:#e4e4e7;font-size:12px;font-weight:600;">Vista texto</button></div>

    <script>
      // Pre-React safety net. If a top-level module evaluation throws (e.g.
      // firebase init, env-var failure, syntax error in a downstream import),
      // `index.tsx` never runs and the static shell above stays visible
      // forever. This listener swaps the shell for a diagnostic panel with
      // copyable details and a reload button so the architect is never stuck.
      (function arkyBootstrapGuard() {
        var rendered = false;
        var buildVersion = (document.querySelector('meta[name=arky-build-version]') && document.querySelector('meta[name=arky-build-version]').getAttribute('content')) || 'dev';
        var lastBootstrapEvent = 'bootstrap-guard-installed';
        function isStaleChunkError(value) {
          return /loading chunk|failed to fetch dynamically imported module|importing a module script failed|module script|vite:preloadError/i.test(String(value || ''));
        }
        function tryReloadStaleBundleOnce(reason) {
          if (!isStaleChunkError(reason)) return false;
          try {
            var key = 'arky:stale-bundle-reload:' + buildVersion;
            if (sessionStorage.getItem(key) === '1') return false;
            sessionStorage.setItem(key, '1');
            if (window.caches && caches.keys) {
              caches.keys().then(function (keys) { keys.forEach(function (keyName) { if (/vite|workbox|arky|precache/i.test(keyName)) caches.delete(keyName); }); });
            }
            window.location.reload();
            return true;
          } catch (_e) {
            return false;
          }
        }
        function show(reason, detail) {
          if (rendered) return;
          // If React already mounted, do not interfere — the React error
          // boundary / runtime overlay will handle it.
          if (document.documentElement.dataset.arkyMounted === 'true') return;
          rendered = true;
          var root = document.getElementById('root');
          if (!root) return;
          var safeReason = String(reason || 'Error desconocido durante el arranque');
          if (tryReloadStaleBundleOnce(safeReason)) return;
          var diagnostic = [
            'buildVersion=' + buildVersion,
            'url=' + window.location.href,
            'userAgent=' + navigator.userAgent,
            'timestamp=' + new Date().toISOString(),
            'lastBootstrapEvent=' + lastBootstrapEvent,
            'reason=' + safeReason,
            detail ? 'detail=' + String(detail).slice(0, 1200) : ''
          ].filter(Boolean).join('\n');
          var safeDetail = diagnostic.slice(0, 1800);
          // Build using DOM APIs to avoid any HTML-injection from error messages.
          root.innerHTML = '';
          var wrap = document.createElement('div');
          wrap.style.cssText = 'min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#09090b;color:#fafafa;font-family:Inter,system-ui,sans-serif;padding:24px;';
          var card = document.createElement('div');
          card.style.cssText = 'max-width:520px;width:100%;border:1px solid rgba(244,63,94,.45);border-radius:22px;background:rgba(24,24,27,.94);box-shadow:0 24px 80px rgba(0,0,0,.45);padding:28px;';
          var tag = document.createElement('p');
          tag.style.cssText = 'margin:0 0 6px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#fda4af;font-weight:700;';
          tag.textContent = 'Arranque protegido';
          var h1 = document.createElement('h1');
          h1.style.cssText = 'font-size:22px;line-height:1.25;margin:0 0 10px;';
          h1.textContent = 'Arky no pudo iniciar';
          var p = document.createElement('p');
          p.style.cssText = 'margin:0 0 12px;color:#d4d4d8;font-size:14px;line-height:1.6;';
          p.textContent = 'La aplicación detectó el fallo y conservó esta pantalla en lugar de quedar en blanco. Puedes copiar o descargar el diagnóstico, reintentar, limpiar estado local corrupto o abrir modo texto seguro.';
          var pre = document.createElement('pre');
          pre.style.cssText = 'margin:0 0 14px;max-height:160px;overflow:auto;white-space:pre-wrap;word-break:break-word;border-radius:14px;background:rgba(0,0,0,.45);padding:12px;font-size:12px;color:#e4e4e7;';
          pre.textContent = safeDetail;
          var actions = document.createElement('div');
          actions.style.cssText = 'display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;';
          var copyBtn = document.createElement('button');
          copyBtn.style.cssText = 'padding:10px 16px;border-radius:10px;border:1px solid #3f3f46;background:transparent;color:#e4e4e7;font-size:13px;font-weight:500;cursor:pointer;';
          copyBtn.textContent = 'Copiar diagnóstico';
          copyBtn.addEventListener('click', function () {
            try {
              navigator.clipboard.writeText(pre.textContent || '');
              copyBtn.textContent = 'Diagnóstico copiado';
            } catch (_e) {
              copyBtn.textContent = 'No se pudo copiar';
            }
          });
          var downloadBtn = document.createElement('button');
          downloadBtn.style.cssText = 'padding:10px 16px;border-radius:10px;border:1px solid #3f3f46;background:transparent;color:#e4e4e7;font-size:13px;font-weight:500;cursor:pointer;';
          downloadBtn.textContent = 'Descargar reporte';
          downloadBtn.addEventListener('click', function () {
            try {
              var blob = new Blob([pre.textContent || ''], { type: 'text/plain;charset=utf-8' });
              var url = URL.createObjectURL(blob);
              var a = document.createElement('a');
              a.href = url;
              a.download = 'arky-bootstrap-report.txt';
              a.click();
              setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
            } catch (_e) {}
          });
          var clearBtn = document.createElement('button');
          clearBtn.style.cssText = 'padding:10px 16px;border-radius:10px;border:1px solid #3f3f46;background:transparent;color:#e4e4e7;font-size:13px;font-weight:500;cursor:pointer;';
          clearBtn.textContent = 'Limpiar estado';
          clearBtn.addEventListener('click', function () { try { localStorage.clear(); sessionStorage.clear(); } catch (_e) {} window.location.reload(); });
          var safeBtn = document.createElement('button');
          safeBtn.style.cssText = 'padding:10px 16px;border-radius:10px;border:1px solid #3f3f46;background:transparent;color:#e4e4e7;font-size:13px;font-weight:500;cursor:pointer;';
          safeBtn.textContent = 'Modo texto';
          safeBtn.addEventListener('click', function () { window.location.href = '/?safeMode=text'; });
          var reloadBtn = document.createElement('button');
