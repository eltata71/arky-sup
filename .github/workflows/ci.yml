name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Reejecutar el pipeline —y con él el despliegue— sin necesidad de un commit.
  # Hace falta para volver a publicar tras cambiar una variable de entorno en
  # Vercel, o para reintentar un despliegue que falló por causa externa; la
  # alternativa es un commit vacío, que ensucia la historia para decir «otra vez».
  workflow_dispatch:

# Least-privilege: this workflow only needs to read the repo (checkout +
# npm ci + build). Nothing here writes back or deploys — that lives in the
# Vercel integration. Keeping contents read-only removes a broad default
# token scope.
permissions:
  contents: read

# Avoid wasting CI minutes on superseded commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The static gates and the build. Together they took 1 m 54 s of the old
  # single job, which is why they are no longer queued behind the test suite:
  # a typo that fails `tsc` should be visible in two minutes, not in twelve.
  quality:
    name: Static gates (typecheck + lint + budgets + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Ningún trabajo de este workflow empuja nada. Persistir el token en
          # .git/config para los pasos siguientes es superficie sin contrapartida.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # `.npmrc` ya no desactiva el resolutor estricto de peer dependencies
      # (D-18, retirada el 2026-09-18 tras comprobar que el árbol resuelto es
      # idéntico con y sin la bandera). Un ERESOLVE en este paso es ahora un
      # conflicto real y se lee aquí, en vez de instalarse y fallar en ejecución.
      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      # Full `strict` for the modules that already hold it. The list in
      # `tsconfig.strict.json` only grows: a module joins when someone does the
      # work, which turns "activate strict" from a months-long branch into a
      # habit. New code starts inside the boundary.
      - name: TypeScript typecheck (strict boundary)
        run: npm run typecheck:strict

      - name: ESLint
        run: npm run lint

      # `no-explicit-any` cannot be switched on globally while the legacy
      # monolith holds 21 of them, so the budget is the interim gate: the count
      # may fall and must never rise. Lowering the number after a reduction is
      # the workflow; raising it is how a gate stops meaning anything.
      - name: Type-safety budget (no new any)
        run: npm run check:any-budget

      # The root collected eleven unreferenced codegen scripts one at a time,
      # each obviously fine on its own. Mechanical rule instead of a convention.
      - name: No orphan scripts in the repository root
        run: npm run check:no-orphan-scripts

      # CLAUDE.md has asked people not to grow the large modules for a long
      # time and nothing checked it, which is how they got here: nobody added a
      # thousand lines, everyone added forty. Each carries the ceiling it has
      # today; a file may shrink and may not grow.
      - name: Module size budget
        run: npm run check:module-size

      # `modules.json` declares the modules and how they may depend on each
      # other; this refuses a new cycle, a new upward import through the layers
      # and a new import that reaches past a module's `index.ts`. Folders do not
      # enforce anything — that is how 24 cycles accumulated without breaking a
      # rule, because there was no rule.
      - name: Module boundaries
        run: npm run check:module-boundaries

      # Vite build does NOT need real env values to compile because all
      # `VITE_*` access happens at runtime from `import.meta.env`. We provide
      # placeholder values so the build does not fail on undefined accesses
      # that some libraries make at module top-level.
      - name: Build
        env:
          VITE_AI_PROXY_URL: /api/ai
          VITE_AI_STRICT_PROXY: 'true'
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci.example.com
          VITE_FIREBASE_PROJECT_ID: ci-project
          VITE_FIREBASE_STORAGE_BUCKET: ci.example.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: '0'
          VITE_FIREBASE_APP_ID: '1:0:web:ci'
          VITE_FIREBASE_MEASUREMENT_ID: G-CI
        run: npm run build

      # A provider key inlined into dist/ is served to every visitor, and the
      # build succeeds either way — so it is checked mechanically rather than
      # trusted to review. Firebase's public client key is not flagged.
      - name: No provider credentials in the bundle
        run: npm run check:bundle-secrets

      # Measures the eager payload — the entry chunk plus what index.html
      # preloads — rather than total build output, most of which is lazy and
      # never reaches a visitor. Vite's own warning fires per chunk at 1.000 kB
      # and says nothing about the critical path.
      - name: Bundle budget
        run: npm run check:bundle-budget

  # The suite, in four parallel shards.
  #
  # It used to be one step of 8 m 49 s — 79 % of the whole job — and the reason
  # was measured twice over. First, `environment: 'jsdom'` applied to all 371
  # test files while ~270 of them never touch a DOM; that is fixed in
  # `vite.config.ts` and cut the local run by a third. Second, whatever
  # remained ran on a single standard runner, which has 2 vCPU: the work was
  # split between two workers no matter how much of it there was.
  #
  # Sharding fixes the second half. Each shard gets its own runner, so the
  # parallelism is real rather than redistributed, and the cost is CI minutes
  # rather than wall-clock time — which is the trade a contributor waiting on
  # a PR wants made.
  tests:
    name: Vitest (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # One failing shard must not cancel the other three. A red suite should
      # report everything that is red, not the first thing.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Ningún trabajo de este workflow empuja nada. Persistir el token en
          # .git/config para los pasos siguientes es superficie sin contrapartida.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Coverage is collected per shard and written into the blob report; the
      # thresholds are NOT applied here. A shard covers a quarter of the test
      # files and therefore a quarter of the executed lines, so enforcing a
      # whole-suite threshold against it would fail every time.
      - name: Vitest shard ${{ matrix.shard }} of 4
        env:
          VITEST_SKIP_THRESHOLDS: '1'
        run: npm run test:shard -- --shard=${{ matrix.shard }}/4

      # `.vitest-reports/` is a dotted directory, and upload-artifact skips
      # hidden files unless told otherwise — without the flag this uploads an
      # empty artifact and the merge job fails with no obvious cause.
      - name: Upload blob report
        uses: actions/upload-artifact@v4
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest-reports/*
          include-hidden-files: true
          retention-days: 1

  # The suite is only whole once the shards are put back together, so this is
  # where the result is judged: the test count, and the coverage floors in
  # `vite.config.ts` measured over one denominator instead of four.
  coverage:
    name: Merged coverage (thresholds)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Ningún trabajo de este workflow empuja nada. Persistir el token en
          # .git/config para los pasos siguientes es superficie sin contrapartida.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download every shard's blob report
        uses: actions/download-artifact@v4
        with:
          path: .vitest-reports
          pattern: vitest-blob-*
          merge-multiple: true

      # `--merge-reports` runs no tests: it replays what the shards recorded,
      # re-aggregates the coverage and applies the thresholds to the total.
      - name: Merge reports and enforce coverage thresholds
        run: npm run test:merge-reports

      - name: Upload coverage report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          retention-days: 7

  rules:
    name: Firestore rules (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `lib/authz` and `firestore.rules` implement the same permission matrix and
    # are compared cell by cell — but only the emulator executes the rules. D-4
    # was precisely a defect that reading the file could not reveal: `isAdmin()`
    # looked correct and was permanently false. Until this ran in CI, the one
    # check that would have caught it was optional.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Ningún trabajo de este workflow empuja nada. Persistir el token en
          # .git/config para los pasos siguientes es superficie sin contrapartida.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # The Firestore emulator is a Java process, and firebase-tools refuses to
      # start it on anything below JDK 21.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Cache Firebase emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      # Same command a contributor runs locally. `firebase-tools` is fetched
      # on demand rather than added to devDependencies: it is a large package
      # and only this job needs it, so making every `npm ci` pay for it would
      # slow the gate that runs on every push.
      - name: Firestore rules against the emulator
        run: npm run test:rules

  # ── Despliegue continuo ────────────────────────────────────────────────────
  #
  # El despliegue vive aquí, detrás de los tres trabajos que juzgan el cambio,
  # y no en la integración Git de Vercel. La diferencia no es de comodidad: la
  # integración de Vercel despliega al recibir el push, sin leer el resultado
  # de ningún gate, y eso fue exactamente lo que ocurrió en este proyecto —
  # producción sirvió durante días un commit que no existía en el repositorio,
  # subido con `vercel --force` desde una estación de trabajo. Un artefacto que
  # no se puede reconstruir desde `main` no es un despliegue, es una copia.
  #
  # `needs` es el contrato: nada llega a producción sin typecheck, lint, los
  # cuatro presupuestos, el build, la suite completa con sus umbrales de
  # cobertura y las reglas de Firestore contra el emulador.
  deploy:
    name: Deploy to Vercel (production)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality, coverage, rules]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'

    # El `concurrency` del workflow cancela ejecuciones superadas, que es lo
    # correcto para unos gates: nadie quiere esperar a que terminen de juzgar un
    # commit que ya no es la cabeza. Para un despliegue es lo contrario. Un
    # `vercel deploy` interrumpido a mitad deja el estado en manos del momento en
    # que llegó la señal, y el trabajo que lo sustituye parte de una premisa
    # falsa: que el anterior no ocurrió.
    #
    # Grupo propio, entonces, y en serie: dos merges seguidos publican dos veces,
    # en orden, en vez de que el segundo decapite al primero.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    # Registra el despliegue en la pestaña *Environments* del repositorio: qué
    # commit está publicado, cuándo y con qué URL. Es también donde se activan
    # las reglas de protección (revisores requeridos, ventana de espera) si la
    # organización decide pedirlas — sin tocar este fichero.
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Ningún trabajo de este workflow empuja nada. Persistir el token en
          # .git/config para los pasos siguientes es superficie sin contrapartida.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # Falla explícito y con la instrucción dentro del error. La alternativa
      # —marcar el trabajo en verde cuando no hay credenciales— produce un
      # pipeline que informa "desplegado" sin haber desplegado nada, que es
      # peor que un rojo accionable.
      - name: Verify deploy credentials are present
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=""
          [ -z "$VERCEL_TOKEN" ] && missing="$missing VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && missing="$missing VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Faltan secretos de despliegue:$missing."
            echo "::error::Configúrelos en Settings → Secrets and variables → Actions."
            echo "::error::Procedimiento completo en docs/ci-cd-pipeline.md §3."
            exit 1
          fi
          echo "Credenciales de despliegue presentes."

      # `vercel pull` trae la configuración del proyecto (framework, comando de
      # build y las variables `VITE_*` de producción) para que el artefacto se
      # construya con los mismos valores que el dashboard declara. Construir
      # aquí y subir el resultado, en vez de dejar que Vercel construya, es lo
      # que hace que el binario desplegado sea el que estos gates validaron.
      - name: Pull Vercel production environment
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build production artefact
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      # El artefacto publicado se vuelve a escanear: `vercel build` usa las
      # variables reales del proyecto, no los placeholders del job `quality`,
      # así que es la primera vez en el pipeline que una clave de proveedor
      # mal configurada como `VITE_*` podría haber entrado en el bundle.
      # Sin `npm ci`: el escáner solo usa módulos nativos de Node, y reinstalar
      # aquí borraría el `node_modules` que `vercel build` acaba de preparar.
      - name: No provider credentials in the deployed bundle
        run: node scripts/checkBundleSecrets.mjs .vercel/output/static

      - name: Deploy prebuilt artefact to production
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # La CLI imprime progreso además de la URL; la URL es la última línea.
          url=$(npx --yes vercel@latest deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}" | tail -n 1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Desplegado: $url"

      # Verificación mínima de que lo desplegado responde: la SPA sirve HTML y
      # la función del proxy contesta su envoltorio de error autenticado. Un
      # 200 con el HTML del SPA en `/api/ai` es el fallo de rewrite que ya
      # ocurrió una vez (F5, `vercel.json`), y este paso lo detecta.
      # `VERCEL_AUTOMATION_BYPASS_SECRET` es opcional y el smoke lo dice cuando
      # falta: el proyecto tiene Vercel Authentication activada, así que sin él
      # la comprobación recibe el muro de inicio de sesión en vez de la
      # aplicación. Sin el secreto el paso avisa y no falla — un rojo aquí no
      # revertiría un despliegue ya publicado ni describiría un fallo de la app.
      # Lo que alguien necesita saber al abrir la ejecución: qué se publicó, de
      # qué commit, y dónde mirar si hay que revertir.
      - name: Record what was published
        if: always()
        run: |
          {
            echo "## Despliegue a producción"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| URL | ${{ steps.deploy.outputs.url }} |"
            echo "| Disparado por | ${{ github.event_name }} |"
            echo
            echo "Reversión: \`vercel rollback <url-anterior>\`, o *Instant Rollback*"
            echo "en el panel del proyecto. Ver \`docs/ci-cd-pipeline.md\` §6."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Production smoke (SPA + proxy contract)
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/deploy/productionSmoke.mjs "${{ steps.deploy.outputs.url }}"
