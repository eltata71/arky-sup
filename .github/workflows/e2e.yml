name: E2E (Playwright)

# Solo en pull request. Un merge a `main` vuelve a ejecutar exactamente el
# mismo commit que la PR acaba de verificar, y esta suite es la más cara del
# repositorio (build + dos navegadores + emuladores): duplicarla no aporta
# señal y consume el presupuesto de minutos que mantiene vivo el resto del
# pipeline. El gate previo al despliegue es `ci.yml`, que sí corre en push.
on:
  pull_request:
    branches: [main]

# Least-privilege: E2E only checks out the repo and runs Playwright. It never
# writes back, so a read-only token is the correct scope.
permissions:
  contents: read

# Avoid wasting CI minutes on superseded commits.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright smoke (desktop + iPad)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Vite inlines `VITE_*` at build time AND the production runtime-config
    # gate runs when `vite preview` loads the config, so every step that
    # builds or serves the artefact needs the same placeholder values. They
    # live at job level so the build step and the Playwright step cannot
    # drift apart again.
    env:
      VITE_AI_PROXY_URL: /api/ai
      VITE_AI_STRICT_PROXY: 'true'
      VITE_FIREBASE_API_KEY: ci-placeholder
      VITE_FIREBASE_AUTH_DOMAIN: localhost
      VITE_FIREBASE_PROJECT_ID: demo-arky-e2e
      VITE_FIREBASE_STORAGE_BUCKET: demo-arky-e2e.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: '0'
      VITE_FIREBASE_APP_ID: '1:0:web:e2e'
      VITE_FIREBASE_MEASUREMENT_ID: G-CI
      VITE_FIREBASE_USE_EMULATORS: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Ningún trabajo de este workflow empuja nada. Persistir el token en
          # .git/config para los pasos siguientes es superficie sin contrapartida.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies (skip Playwright browser auto-download)
        env:
          # We download the browsers in the next step with explicit caching.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      # Playwright maintains its own browser cache under ~/.cache/ms-playwright.
      # Caching it by Playwright version keeps installs near-instant after the
      # first run on a new version.
      - name: Read Playwright version
        id: playwright-version
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers (chromium + webkit)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Install Playwright system deps (if cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      # The suite runs against `dist/` served by `vite preview`, not against the
      # dev server — see the comment in `playwright.config.ts`. The job-level
      # `env` above provides the same placeholder `VITE_*` values the CI build
      # uses; they are inlined at build time, so they must be present here
      # rather than only at run time.
      - name: Build the artefact the E2E suite will test
        run: npm run build

      # The emulators make authenticated coverage mandatory on every PR,
      # including forks where repository secrets are intentionally unavailable.
      # The seed is idempotent and the project id cannot point at production.
      - name: Run Playwright journeys against isolated Firebase emulators
        env:
          CI: 'true'
        run: >-
          npx --yes firebase-tools emulators:exec
          --config firebase.e2e.json
          --only auth,firestore
          --project demo-arky-e2e
          "npm run e2e:seed && npm run e2e -- --reporter=line"

      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
