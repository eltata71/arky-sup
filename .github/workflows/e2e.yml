name: E2E (Playwright)

# Solo en pull request. Un merge a `main` vuelve a ejecutar exactamente el
# mismo commit que la PR acaba de verificar, y esta suite es la más cara del
# repositorio (build + dos navegadores + emuladores): duplicarla no aporta
# señal y consume el presupuesto de minutos que mantiene vivo el resto del
# pipeline. El gate previo al despliegue es `ci.yml`, que sí corre en push.
on:
  pull_request:
    branches: [main]

# Least-privilege: E2E only checks out the repo and runs Playwright. It never
# writes back, so a read-only token is the correct scope.
permissions:
  contents: read

# Avoid wasting CI minutes on superseded commits.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright smoke (desktop + iPad)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Vite inlines `VITE_*` at build time AND the production runtime-config
    # gate runs when `vite preview` loads the config, so every step that
    # builds or serves the artefact needs the same values. Los que son
    # constantes viven aquí, a nivel de job, para que el paso de build y el de
    # Playwright no puedan volver a divergir.
    #
    # **La clave publicable NO está aquí, y es deliberado.** Estuvo, con un valor
    # de relleno, mientras el paso «Export local Supabase credentials» escribía
    # la real en `$GITHUB_ENV`. Dos definiciones de la misma variable y una regla
    # de precedencia de por medio: cuál gana no se lee en este fichero, y una
    # variable cuya procedencia hay que deducir es la que produce un fallo que no
    # se parece a su causa —o el artefacto habla con un backend inexistente, o lo
    # hace con una clave que no existe, y las dos cosas se ven igual cinco pasos
    # más allá—. Ahora hay una sola fuente: la que el stack local publica.
    env:
      VITE_AI_PROXY_URL: /api/ai
      VITE_AI_STRICT_PROXY: 'true'
      # La URL del stack local sí es constante: siempre es ésta.
      VITE_SUPABASE_URL: http://127.0.0.1:54321

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Ningún trabajo de este workflow empuja nada. Persistir el token en
          # .git/config para los pasos siguientes es superficie sin contrapartida.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.117.0

      - name: Install dependencies (skip Playwright browser auto-download)
        env:
          # We download the browsers in the next step with explicit caching.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      # Playwright maintains its own browser cache under ~/.cache/ms-playwright.
      # Caching it by Playwright version keeps installs near-instant after the
      # first run on a new version.
      - name: Read Playwright version
        id: playwright-version
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers (chromium + webkit)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Install Playwright system deps (if cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      # El stack local se levanta **antes** del build: la clave publicable real
      # sale de `supabase status` y Vite la inlinea en tiempo de compilación,
      # así que un build hecho con el marcador serviría un bundle que no puede
      # hablar con la base.
      - name: Start the local Supabase stack
        run: bash scripts/supabase/local.sh start

      - name: Rebuild schema from migrations and seed
        run: bash scripts/supabase/local.sh reset

      - name: Export local Supabase credentials
        run: |
          supabase status -o env > /tmp/supabase.env
          set -a; . /tmp/supabase.env; set +a
          # Una clave vacía aquí no rompe nada de forma visible: sobreescribe el
          # valor de relleno del bloque `env` con la cadena vacía, el build sale
          # verde, y la aplicación arranca creyendo que no hay backend. El
          # síntoma llega cinco pasos después, como un recorrido autenticado que
          # se queda en `/auth` sin decir por qué.
          for required in ANON_KEY SERVICE_ROLE_KEY; do
            if [[ -z "${!required:-}" ]]; then
              echo "::error::supabase status -o env no devolvió $required. El stack local no expuso sus claves; sin ellas el artefacto se compila contra un backend inexistente."
              exit 1
            fi
          done
          {
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SUPABASE_URL=http://127.0.0.1:54321"
          } >> "$GITHUB_ENV"

      # The suite runs against `dist/` served by `vite preview`, not against the
      # dev server — see the comment in `playwright.config.ts`. The job-level
      # `env` above provides the same `VITE_*` values the CI build uses; they
      # are inlined at build time, so they must be present here rather than only
      # at run time.
      - name: Build the artefact the E2E suite will test
        run: npm run build

      # El stack local hace obligatoria la cobertura autenticada en cada PR,
      # incluidas las de un fork, donde los secretos del repositorio no están
      # disponibles a propósito. La siembra es idempotente y se niega a correr
      # contra cualquier URL que no sea local.
      - name: Seed the authenticated E2E account
        run: npm run e2e:seed

      - name: Run Playwright journeys
        env:
          CI: 'true'
        run: npm run e2e -- --reporter=line

      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

      - name: Dispose the local stack
        if: always()
        run: bash scripts/supabase/local.sh stop
