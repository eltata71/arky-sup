name: Security

# CodeQL and a dependency audit. Neither existed: the repository had no SAST,
# no advisory gate and no automated dependency updates, while shipping a
# browser app that handles authentication and renders model output.
#
# Runs on PRs so a finding arrives with the change that caused it, and weekly
# so an advisory published against code nobody is touching still surfaces.
# PR y semanal, no en push. El push a `main` analiza el mismo árbol que la PR
# acabó de analizar; el barrido semanal es el que cubre el caso que la PR no
# puede ver, que es un aviso publicado contra código que nadie está tocando.
on:
  pull_request:
    branches: [main]
  schedule:
    # Monday morning, after Dependabot has opened its weekly PRs.
    - cron: '0 7 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # The CodeQL action reads its own workflow run to fingerprint results.
      # On a private repository that call needs `actions: read`, and without it
      # the analyze step fails with "Resource not accessible by integration"
      # after a perfectly successful scan.
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Ningún trabajo de este workflow empuja nada. Persistir el token en
          # .git/config para los pasos siguientes es superficie sin contrapartida.
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # `security-extended` over the default: the default query pack omits
          # several of the DOM-injection and prototype-pollution queries, which
          # are exactly the classes this codebase has had to fix by hand.
          queries: security-extended

      # `upload: never`, because this repository is private and uploading to
      # the Security tab needs GitHub Advanced Security. Without it the
      # analysis ran fine and the job still failed on the upload — a gate that
      # is red for a reason nobody can act on is a gate people learn to ignore.
      # The results are enforced here instead, and kept as an artifact.
      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
          output: sarif-results
          upload: never

      # The findings are the gate. Anything CodeQL rates `error` fails the
      # build; warnings and notes are reported and do not block, which is the
      # same bar `npm audit` is held to in the job below.
      - name: Fail on error-level findings
        run: |
          shopt -s nullglob
          files=(sarif-results/*.sarif)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No SARIF produced — the analysis did not run."
            exit 1
          fi
          total=0
          for f in "${files[@]}"; do
            errors=$(jq '[.runs[].results[]? | select((.level // "warning") == "error")] | length' "$f")
            notes=$(jq '[.runs[].results[]?] | length' "$f")
            echo "$f: $notes finding(s), $errors at error level"
            total=$((total + errors))
          done
          if [ "$total" -gt 0 ]; then
            echo "::error::CodeQL reported $total error-level finding(s)."
            jq -r '.runs[].results[]? | select((.level // "warning") == "error")
                   | "\(.ruleId): \(.message.text) — \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' \
              "${files[@]}"
            exit 1
          fi

      - name: Upload CodeQL results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: sarif-results
          retention-days: 30

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Ningún trabajo de este workflow empuja nada. Persistir el token en
          # .git/config para los pasos siguientes es superficie sin contrapartida.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fails on high and critical only. Auditing at `moderate` on a front-end
      # tree means failing on advisories against build-time packages that never
      # reach a browser, and a gate that fails for reasons nobody can act on
      # gets switched off. Dependabot handles the rest on its own schedule.
      - name: npm audit (high and critical)
        run: npm audit --audit-level=high

      # An SBOM per run, so "which version of what did that release ship?" is
      # answerable after the fact rather than reconstructed from a lockfile
      # diff.
      # D-15. Escribía `{}` cuando `npm sbom` fallaba, y subía ese `{}` como
      # artefacto llamado «sbom»: un inventario vacío indistinguible de uno que
      # declara que el build no tiene dependencias. La pregunta que un SBOM
      # existe para responder —«¿qué versión de qué se publicó?»— quedaba
      # contestada con una mentira sintácticamente válida. Ahora falla el paso.
      - name: Generate SBOM
        if: always()
        run: |
          set -o pipefail
          npm sbom --sbom-format cyclonedx > sbom.cyclonedx.json
          node -e "const s=require('./sbom.cyclonedx.json'); const n=(s.components||[]).length; if(!s.bomFormat||n===0){console.error('::error::SBOM vacío o sin bomFormat ('+n+' componentes).');process.exit(1)} console.log('SBOM con '+n+' componentes.')"

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cyclonedx.json
          retention-days: 90
