name: Mirror source repository

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mirror-source.yml'

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout frozen source
        uses: actions/checkout@v4
        with:
          repository: eltata71/arkypro-1.0
          ref: cc87faa80a1c452cc0d11a75ab8730ee4d7a3c87
          token: ${{ github.token }}
          path: __source

      - name: Replace destination working tree
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='__source/' __source/ ./
          rm -rf __source
          git add -A
          if git diff --cached --quiet; then
            echo 'Destination already matches source.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Mirror arkypro-1.0 at cc87faa80a1c452cc0d11a75ab8730ee4d7a3c87'
          git push origin HEAD:main
